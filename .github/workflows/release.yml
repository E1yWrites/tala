name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tala ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install Tala."
          releaseDraft: false
          prerelease: false
          includeUpstream: true
          args: --target x86_64-pc-windows-msvc

      - name: Generate checksums
        shell: bash
        run: |
          cd src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          find . -maxdepth 3 \( -name "*.exe" -o -name "*.msi" \) -type f | while read f; do
            sha256sum "$f" >> SHA256SUMS
          done

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/SHA256SUMS
