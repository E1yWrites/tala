<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tala — Pagtatala, made simple. A fast, local-first note-taking app." />
    <meta name="theme-color" content="#f3f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tala</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background-color: #f3f6f2;
        color: #17201a;
        transition: opacity 240ms ease;
        font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
      }
      #splash.dark {
        background-color: #101512;
        color: #e9efe9;
      }
      .splash-mark {
        width: 120px;
        height: 120px;
        animation: splash-pop 480ms cubic-bezier(0.16, 1, 0.3, 1) both, splash-bob 3.2s 480ms ease-in-out infinite;
      }
      .splash-mark img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .splash-tagline {
        font-size: 18px;
        opacity: 0.7;
        animation: splash-fade 500ms 220ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-bar {
        width: 96px;
        height: 4px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 4px;
        background: #dfe5dd;
        animation: splash-fade 400ms 300ms both;
      }
      #splash.dark .splash-bar {
        background: #2a342d;
      }
      .splash-bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 4px;
        background: #2b7a3f;
        transform-origin: left;
        animation: splash-fill 1500ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #splash.dark .splash-bar::after {
        background: #5cc277;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.85); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes splash-fade {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 0.85; transform: translateY(0); }
      }
      @keyframes splash-fill {
        from { transform: scaleX(0.08); }
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark, .splash-tagline, .splash-bar { animation: none !important; opacity: 1; }
        .splash-bar::after { animation: none !important; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="Tala is loading">
      <div class="splash-mark">
        <img src="/bituin-192.png" width="120" height="120" alt="" />
      </div>
      <div class="splash-tagline">Pagtatala, made simple.</div>
      <div class="splash-bar"></div>
    </div>
    <script>
      /* Applied before first paint to avoid a flash of the wrong theme.
         Runs at the end of <body> so the splash element already exists.
         Bituin's outline reads on both grounds, so one image serves both. */
      (function () {
        try {
          var t = localStorage.getItem('tala:theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.background = dark ? '#101512' : '#f3f6f2';
          var s = document.getElementById('splash');
          if (s && dark) s.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
